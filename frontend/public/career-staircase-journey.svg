  <text x="176" y="412" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#4c78a0">03</text>

  <polygon points="216,494 444,494 422,476 194,476" fill="#16222f"/>
  <polygon points="216,494 444,494 444,517 216,517" fill="#070b15"/>
  <line x1="216" y1="494" x2="444" y2="494" stroke="#1f2f48" stroke-width=".8"/>
