<svg width="100%" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Career staircase journey</title>
  <desc id="desc">Atmospheric dark perspective staircase with five labeled career milestones ascending from bottom right to upper center. A silhouetted figure stands at the current step with three ghost steps fading into mist above.</desc>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulse-a {
      0%, 100% { opacity: .38; }
      50% { opacity: .62; }
    }
  </style>

  <defs>
    <radialGradient id="tl" cx="38%" cy="5%" r="65%"><stop offset="0%" stop-color="#8ab4d4" stop-opacity=".2"/><stop offset="100%" stop-color="#070b14" stop-opacity="0"/></radialGradient>
    <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="83%" stop-color="#070b14" stop-opacity="0"/><stop offset="100%" stop-color="#040810" stop-opacity=".93"/></linearGradient>
    <linearGradient id="tm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8d4ea" stop-opacity=".28"/><stop offset="30%" stop-color="#b8d4ea" stop-opacity="0"/></linearGradient>
    <radialGradient id="pg" cx="50%" cy="48%" r="55%"><stop offset="0%" stop-color="#608ab8" stop-opacity=".52"/><stop offset="100%" stop-color="#608ab8" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="28%" r="68%"><stop offset="0%" stop-color="#3a6898" stop-opacity=".16"/><stop offset="100%" stop-color="#3a6898" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="680" height="660" fill="#070b14"/>
  <rect width="680" height="660" fill="url(#tl)"/>

  <rect x="118" y="86" width="14" height="518" fill="#0d1620" rx="2"/>
  <rect x="119" y="86" width="3" height="518" fill="#1c2d42" opacity=".5"/>

  <g opacity=".07">
    <polygon points="148,96 292,96 270,78 126,78" fill="#1d2b3e"/>
    <polygon points="148,96 292,96 292,118 148,118" fill="#080f18"/>
  </g>

  <g opacity=".16">
    <polygon points="150,150 310,150 288,132 128,132" fill="#1b293c"/>
    <polygon points="150,150 310,150 310,172 150,172" fill="#070d17"/>
  </g>

  <g opacity=".36">
    <polygon points="157,210 332,210 310,192 135,192" fill="#192637"/>
    <line x1="157" y1="210" x2="332" y2="210" stroke="#243954" stroke-width=".7"/>
    <polygon points="157,210 332,210 332,234 157,234" fill="#060c16"/>
