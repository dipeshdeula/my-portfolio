  <text x="515" y="294" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a90cc">Current</text>

  <text x="490" y="335" font-family="sans-serif" font-size="11" fill="#2d4460">Webpal · 2024–2025</text>
  <text x="490" y="349" font-family="sans-serif" font-size="13" fill="#6690b6" font-weight="500">Software Engineer</text>

  <text x="490" y="408" font-family="sans-serif" font-size="11" fill="#253b55">PARS · 2024–2025</text>
  <text x="490" y="422" font-family="sans-serif" font-size="13" fill="#507698" font-weight="500">Full-Stack Dev</text>

  <text x="490" y="485" font-family="sans-serif" font-size="11" fill="#1d2e48">Truenary · 2024–2025</text>
  <text x="490" y="499" font-family="sans-serif" font-size="13" fill="#406688" font-weight="500">SE Intern</text>

  <text x="490" y="566" font-family="sans-serif" font-size="11" fill="#192638">Kutumba · 2024–2025</text>
  <text x="490" y="580" font-family="sans-serif" font-size="13" fill="#345670" font-weight="500">Backend Intern</text>

  <text x="318" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2d4860" letter-spacing="5">AHEAD</text>

  <rect width="680" height="660" fill="url(#bf)"/>
  <rect width="680" height="232" fill="url(#tm)"/>

  <circle cx="390" cy="152" r="1.5" fill="#5070a0" opacity=".4"/>
  <circle cx="436" cy="120" r="1" fill="#406890" opacity=".3"/>
  <circle cx="348" cy="106" r="1.5" fill="#508098" opacity=".26"/>
  <circle cx="316" cy="140" r="1" fill="#406888" opacity=".36"/>
  <circle cx="474" cy="174" r="1.2" fill="#507a98" opacity=".32"/>
  <circle cx="286" cy="118" r="1" fill="#3a6080" opacity=".27"/>
