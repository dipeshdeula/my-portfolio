server{
    listen 80;
    listen [::]:80;

    server_name deuladipesh.info.np www.deuladipesh.info.np;

    root /var/www/my-portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri = 404;

        expires 1y;
        add_header Cache-Control "public, immutable";

    }
    location = /index.html{
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/my-portfolio.access_log;
    error_log /var/log/nginx/my-portfolio.error_log;
    
}