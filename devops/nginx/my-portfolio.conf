server {
    listen 80;
    listen [::]:80;

    server_name deuladipesh.info.np www.deuladipesh.info.np;

    root /var/www/my-portfolio;
    index index.html;

    # Compression for Core Web Vitals (LCP / FCP)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security & SEO headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|site\.webmanifest|og-image\.png)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/my-portfolio.access_log;
    error_log /var/log/nginx/my-portfolio.error_log;
}
