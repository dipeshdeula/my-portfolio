name: Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Verify frontend build (Runs on every push & PR - 100% Free on GitHub Actions)
  build-verify:
    name: Build & Typecheck Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

  # 2. AWS EC2 Deployment (Paused while AWS credit is out; enable later by setting repo variable ENABLE_AWS_DEPLOY=true)
  deploy-aws-ec2:
    name: Deploy to AWS EC2 (Nginx)
    needs: build-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /home/ubuntu/apps/my-portfolio/devops/scripts/deploy-frontend.sh
