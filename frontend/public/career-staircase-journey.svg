  <circle cx="356" cy="275" r="2.8" fill="#4880b0"/>
  <line x1="383" y1="344" x2="483" y2="344" stroke="#1d2f4d" stroke-width=".7" stroke-dasharray="3,3"/>
  <circle cx="383" cy="344" r="2.5" fill="#3468a0"/>
  <line x1="413" y1="417" x2="483" y2="417" stroke="#17273f" stroke-width=".7" stroke-dasharray="3,3"/>
  <circle cx="413" cy="417" r="2.5" fill="#2a5888"/>
